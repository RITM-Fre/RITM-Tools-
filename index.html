<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RITM Tools — ابزارهای آنلاین رایگان</title>
<meta name="description" content="ابزارهای روزمره رایگان: شمارنده متن، رمز عبور، ماشین حساب، تبدیل واحد و بیشتر؛ همه در مرورگر شما.">
<meta name="theme-color" content="#080a12">
<link rel="alternate" hreflang="fa" href="./">
<link rel="alternate" hreflang="en" href="./">
<link rel="alternate" hreflang="x-default" href="./">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script type="application/ld+json" id="ld">{}</script>
<style>
/* =====================================================================
   RITM Tools — redesigned. Breakpoints: mobile <760, tablet 760-1100,
   desktop >1100. Floating pill header on desktop, bottom dock on mobile.
   ===================================================================== */
*{box-sizing:border-box}
:root{
  --bg:#080a12;
  --surface:rgba(18,22,42,0.65);
  --surface2:rgba(24,28,52,0.92);
  --fg:#eef0ff;
  --mut:#8a90b8;
  --pri:#7c5cff;
  --pri2:#00d4ff;
  --acc:#ff3ea5;
  --bd:rgba(124,92,255,0.22);
  --bd2:rgba(255,255,255,0.06);
  --input:rgba(0,0,0,0.28);
  --sh:0 20px 50px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04) inset;
}
[data-theme=light]{
  --bg:#eef1fb;
  --surface:rgba(255,255,255,0.78);
  --surface2:rgba(255,255,255,0.96);
  --fg:#0d1020;
  --mut:#5a6086;
  --pri:#5b47e0;
  --pri2:#0080b8;
  --acc:#d81f7a;
  --bd:rgba(91,71,224,0.2);
  --bd2:rgba(0,0,0,0.05);
  --input:rgba(255,255,255,0.85);
  --sh:0 20px 50px -20px rgba(60,60,140,0.22), 0 0 0 1px rgba(255,255,255,0.7) inset;
}
html[lang=fa]{font-family:Vazirmatn,Tahoma,sans-serif}
html[lang=en]{font-family:Inter,system-ui,sans-serif}
html,body{height:100%}
body{
  margin:0;min-height:100vh;color:var(--fg);background:var(--bg);
  overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:3px;border-radius:8px}
::selection{background:var(--pri);color:#fff}

/* ---------- animated background (3D-ish orbs + grid) ---------- */
.bgfx{
  position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(ellipse at 15% 0%, rgba(124,92,255,0.20), transparent 55%),
    radial-gradient(ellipse at 85% 100%, rgba(0,212,255,0.16), transparent 55%),
    var(--bg);
}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;mix-blend-mode:screen;will-change:transform}
[data-theme=light] .orb{mix-blend-mode:multiply;opacity:.35}
.o1{width:520px;height:520px;background:#7c5cff;top:-160px;inset-inline-start:-140px;animation:drift1 22s ease-in-out infinite}
.o2{width:460px;height:460px;background:#00d4ff;bottom:-180px;inset-inline-end:-140px;animation:drift2 26s ease-in-out infinite}
.o3{width:380px;height:380px;background:#ff3ea5;top:40%;inset-inline-start:50%;animation:drift3 30s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,60px) scale(1.15)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-100px,-60px) scale(1.1)}}
@keyframes drift3{0%,100%{transform:translate(-50%,0) scale(1)}50%{transform:translate(-50%,-80px) scale(1.2)}}
.grid-bg{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(124,92,255,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124,92,255,0.07) 1px, transparent 1px);
  background-size:60px 60px;
  -webkit-mask-image:radial-gradient(ellipse at center, #000 25%, transparent 72%);
  mask-image:radial-gradient(ellipse at center, #000 25%, transparent 72%);
}
[data-theme=light] .grid-bg{background-image:
  linear-gradient(rgba(91,71,224,0.09) 1px, transparent 1px),
  linear-gradient(90deg, rgba(91,71,224,0.09) 1px, transparent 1px)}

/* ---------- opening / splash ---------- */
#splash{
  position:fixed;inset:0;z-index:9999;background:#04050c;display:grid;place-items:center;
  transition:opacity .8s ease, transform .8s cubic-bezier(.6,0,.2,1);overflow:hidden;
}
#splash.out{opacity:0;transform:scale(1.1);pointer-events:none}
#splash::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 50%, rgba(124,92,255,0.28), transparent 60%);
  animation:pulseBg 3s ease-in-out infinite;
}
@keyframes pulseBg{0%,100%{opacity:.6}50%{opacity:1}}
.splash-rings{position:absolute;top:50%;left:50%;width:0;height:0;pointer-events:none}
.splash-rings span{
  position:absolute;top:50%;left:50%;width:120px;height:120px;margin:-60px 0 0 -60px;
  border-radius:50%;border:1px solid rgba(124,92,255,0.65);
  animation:ringOut 2.4s ease-out infinite;
}
.splash-rings span:nth-child(2){animation-delay:.8s;border-color:rgba(0,212,255,0.55)}
.splash-rings span:nth-child(3){animation-delay:1.6s;border-color:rgba(255,62,165,0.55)}
@keyframes ringOut{0%{transform:scale(.35);opacity:1}100%{transform:scale(4.5);opacity:0}}
.splash-content{position:relative;text-align:center;padding:1rem}
.splash-mark{
  font-size:clamp(76px,17vw,140px);line-height:1;display:inline-block;
  background:linear-gradient(135deg,#7c5cff 0%,#00d4ff 50%,#ff3ea5 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 34px rgba(124,92,255,0.85));
  animation:markIn 1s cubic-bezier(.2,.9,.3,1.4) both;
}
.splash-title{
  font-size:clamp(1.5rem,5vw,2.3rem);font-weight:900;letter-spacing:.32em;
  margin:.4rem 0 0;color:#fff;text-transform:uppercase;
  animation:fadeUp .8s .35s both;
}
.splash-sub{
  color:#8a90b8;font-size:.78rem;letter-spacing:.42em;margin:.75rem 0 1.8rem;
  text-transform:uppercase;animation:fadeUp .8s .5s both;
}
.splash-loader{
  width:190px;height:3px;border-radius:3px;background:rgba(255,255,255,0.08);
  overflow:hidden;margin:0 auto;animation:fadeUp .8s .65s both;
}
.splash-loader span{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,#7c5cff,#00d4ff,#ff3ea5);
  animation:load 1.5s .75s cubic-bezier(.5,0,.2,1) forwards;
  box-shadow:0 0 14px #7c5cff;
}
@keyframes markIn{0%{opacity:0;transform:scale(.25) rotate(-180deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes load{to{width:100%}}

/* ---------- header ---------- */
.hdr{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100;
  display:flex;align-items:center;gap:1.5rem;
  padding:9px 12px 9px 22px;
  border-radius:999px;
  background:var(--surface);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--bd);
  box-shadow:var(--sh), 0 0 70px -25px rgba(124,92,255,0.6);
  max-width:calc(100vw - 40px);
  animation:hdrIn .8s .2s both;
}
@keyframes hdrIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.logo{display:flex;align-items:center;gap:.55rem;text-decoration:none;font-weight:800;font-size:1.05rem;letter-spacing:-.01em;white-space:nowrap}
.logo .mark{
  font-size:1.55rem;display:inline-block;
  background:linear-gradient(135deg,#7c5cff,#00d4ff,#ff3ea5);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(124,92,255,0.85));
  transition:transform .4s cubic-bezier(.2,.9,.3,1.5);
}
.logo:hover .mark{transform:rotate(180deg) scale(1.15)}
.bar{display:flex;gap:.4rem;align-items:center}
.ib,.btn{
  font:inherit;cursor:pointer;border:1px solid var(--bd);border-radius:999px;
  padding:.5rem .9rem;background:rgba(255,255,255,0.03);color:var(--fg);
  transition:transform .25s cubic-bezier(.2,.8,.2,1), background .25s, border-color .25s, box-shadow .25s;
  display:inline-flex;align-items:center;gap:.4rem;line-height:1;white-space:nowrap;
}
[data-theme=light] .ib{background:rgba(0,0,0,0.03)}
.ib:hover{background:rgba(124,92,255,0.15);border-color:var(--pri);transform:translateY(-1px)}
.btn{
  background:linear-gradient(135deg,#7c5cff,#5b47e0);color:#fff;border:0;
  padding:.65rem 1.15rem;font-weight:600;
  box-shadow:0 8px 22px -8px rgba(124,92,255,0.7);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -8px rgba(124,92,255,0.85)}
.btn.sec{background:rgba(255,255,255,0.05);color:var(--fg);border:1px solid var(--bd);box-shadow:none}
[data-theme=light] .btn.sec{background:rgba(0,0,0,0.04)}
.btn.sec:hover{background:rgba(124,92,255,0.15);border-color:var(--pri)}
.ib:active,.btn:active{transform:scale(.95)}
.caret{font-size:.7em;opacity:.7}

/* dropdown */
.dd{position:relative}
.dd ul{
  position:absolute;inset-inline-end:0;top:calc(100% + 10px);
  margin:0;padding:.5rem;list-style:none;min-width:13rem;
  background:var(--surface2);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);
  animation:ddIn .22s cubic-bezier(.2,.9,.3,1.3);z-index:120;
}
.dd ul[hidden]{display:none}
.dd a{
  display:block;padding:.6rem .8rem;border-radius:10px;text-decoration:none;
  direction:ltr;text-align:left;font-size:.92rem;transition:background .18s, color .18s;
}
.dd a:hover{background:rgba(124,92,255,0.18);color:var(--pri2)}
@keyframes ddIn{from{opacity:0;transform:translateY(-10px) scale(.96)}}

/* ---------- main / layout ---------- */
main{
  flex:1;width:100%;max-width:1180px;margin:0 auto;
  padding:118px 1.25rem 90px;position:relative;z-index:1;
}
.hero{text-align:center;padding:1.5rem 0 2.5rem;position:relative;animation:fadeUp .7s .3s both}
.hero h1{
  font-size:clamp(2.4rem,7vw,4.6rem);margin:0 0 .5rem;font-weight:900;
  letter-spacing:-.035em;line-height:1.02;
  background:linear-gradient(120deg,var(--fg) 0%,var(--pri) 45%,var(--pri2) 75%,var(--acc) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{color:var(--mut);font-size:clamp(.95rem,2vw,1.15rem);max-width:620px;margin:0 auto;line-height:1.65}
.search{
  width:100%;max-width:560px;margin:1.6rem auto 0;display:block;
  font:inherit;font-size:1rem;padding:.95rem 1.4rem;border-radius:999px;
  border:1px solid var(--bd);background:var(--surface);color:var(--fg);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 12px 34px -18px rgba(124,92,255,0.55);
  transition:border-color .25s, box-shadow .25s, transform .25s;
}
.search:hover{transform:translateY(-1px)}
.search:focus{
  outline:none;border-color:var(--pri);
  box-shadow:0 0 0 4px rgba(124,92,255,0.16), 0 14px 34px -12px rgba(124,92,255,0.75);
}
.search::placeholder{color:var(--mut)}
h2{margin:2rem 0 .9rem;font-size:1.05rem;font-weight:700;letter-spacing:.02em;color:var(--mut);text-transform:uppercase;font-size:.82rem}
h2::before{
  content:"";display:inline-block;width:8px;height:8px;margin-inline-end:.55rem;
  border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));
  box-shadow:0 0 10px var(--pri);vertical-align:middle;
}
.grid{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}

/* ---------- 3D-ish cards ---------- */
.card{
  position:relative;display:flex;flex-direction:column;gap:.45rem;
  padding:1.4rem;border-radius:22px;text-decoration:none;color:var(--fg);
  background:linear-gradient(150deg, rgba(30,34,58,0.85), rgba(14,16,30,0.92));
  border:1px solid var(--bd);overflow:hidden;
  transition:transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s, border-color .45s;
  transform-style:preserve-3d;will-change:transform;
  animation:cardIn .5s both;
}
[data-theme=light] .card{background:linear-gradient(150deg, rgba(255,255,255,0.96), rgba(238,241,255,0.92))}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card::before{
  content:"";position:absolute;inset:0;opacity:0;transition:opacity .35s;pointer-events:none;
  background:radial-gradient(220px circle at var(--x,50%) var(--y,50%), rgba(124,92,255,0.35), transparent 70%);
}
.card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg, rgba(124,92,255,0.7), rgba(0,212,255,0.4), rgba(255,62,165,0.6));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .35s;
}
.card:hover{
  transform:translateY(-6px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  box-shadow:0 32px 60px -26px rgba(124,92,255,0.65);
}
.card:hover::before,.card:hover::after{opacity:1}
.card>*{position:relative;z-index:1}
.card .ic{
  font-size:1.7rem;width:54px;height:54px;display:grid;place-items:center;border-radius:16px;
  background:linear-gradient(135deg, rgba(124,92,255,0.22), rgba(0,212,255,0.14));
  border:1px solid rgba(124,92,255,0.28);
  box-shadow:inset 0 0 22px rgba(124,92,255,0.22), 0 6px 18px -8px rgba(124,92,255,0.55);
  margin-bottom:.5rem;transition:transform .4s cubic-bezier(.2,.9,.3,1.4);
}
.card:hover .ic{transform:translateZ(24px) scale(1.08)}
.card b{font-size:1.05rem;font-weight:700}
.card small{color:var(--mut);font-size:.86rem;line-height:1.55}

/* ---------- tool panel ---------- */
.panel{
  display:grid;gap:1rem;padding:1.6rem;border-radius:24px;
  background:var(--surface);border:1px solid var(--bd);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  box-shadow:var(--sh);position:relative;overflow:hidden;
  animation:fadeUp .5s both;
}
.panel::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(124,92,255,0.7),rgba(0,212,255,0.5),transparent);
}
.f{display:grid;gap:.5rem}
.f>span{font-size:.85rem;color:var(--mut);font-weight:500}
.f input,.f select,.f textarea{
  width:100%;font:inherit;padding:.8rem 1rem;border-radius:14px;
  border:1px solid var(--bd);background:var(--input);color:var(--fg);
  transition:border-color .2s, box-shadow .2s, background .2s;
}
.f input:hover,.f select:hover,.f textarea:hover{border-color:rgba(124,92,255,0.45)}
.f input:focus,.f select:focus,.f textarea:focus{
  outline:none;border-color:var(--pri);
  box-shadow:0 0 0 4px rgba(124,92,255,0.16);
}
.f textarea{resize:vertical;min-height:130px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.94rem;line-height:1.6}
[data-theme=light] .f select option{background:#fff;color:#0d1020}
.f select{appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-inline-end:2.4rem}
html[dir=rtl] .f select{background-position:20px 50%,14px 50%}
.ltr{direction:ltr;text-align:left}
.row{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center}
.chk{display:flex;gap:.45rem;align-items:center;cursor:pointer;padding:.35rem .7rem;border-radius:999px;border:1px solid var(--bd);background:rgba(255,255,255,0.03);transition:border-color .2s, background .2s}
[data-theme=light] .chk{background:rgba(0,0,0,0.03)}
.chk:hover{border-color:var(--pri);background:rgba(124,92,255,0.1)}
.chk input{accent-color:var(--pri);cursor:pointer;width:16px;height:16px}
.res{
  display:block;font-size:1.25rem;font-weight:700;word-break:break-all;
  padding:.9rem 1rem;border-radius:14px;background:rgba(124,92,255,0.08);
  border:1px dashed var(--bd);min-height:1.4em;color:var(--fg);
}
.res:empty{display:none}
.err{color:#c23232;margin:0;font-size:.9rem}
[data-theme=dark] .err{color:#ff8a8a}
.meter{height:10px;border-radius:5px;background:rgba(255,255,255,0.08);overflow:hidden}
[data-theme=light] .meter{background:rgba(0,0,0,0.08)}
.meter i{display:block;height:100%;width:0;transition:width .35s, background .35s;border-radius:5px}
.big{font-size:4.5rem;text-align:center;min-height:6.5rem;line-height:1.2;user-select:none;display:grid;place-items:center}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(.3) rotate(-90deg);opacity:.2}100%{transform:none;opacity:1}}
.empty{text-align:center;padding:3.5rem 1rem;color:var(--mut)}
.empty .big{font-size:3.5rem;min-height:auto;margin-bottom:1rem;opacity:.55}
.back{
  display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;
  color:var(--mut);font-size:.9rem;padding:.45rem .9rem;border-radius:10px;
  border:1px solid transparent;transition:all .2s;margin-bottom:.9rem;
}
.back:hover{color:var(--pri);border-color:var(--bd);background:rgba(124,92,255,0.08)}
main>h1{font-size:clamp(1.5rem,4vw,2.1rem);margin:.2rem 0 .4rem;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 1.3rem;font-size:.95rem;line-height:1.6}
.note{
  text-align:center;color:var(--mut);font-size:.85rem;margin-top:2.5rem;
  padding:1rem;border-radius:14px;background:rgba(124,92,255,0.06);
  border:1px dashed var(--bd);line-height:1.6;
}
ul{padding-inline-start:1.2rem;margin:.4rem 0}
li{color:var(--mut);font-size:.88rem;margin:.25rem 0}

/* ---------- toast ---------- */
#toast{
  position:fixed;top:1.2rem;inset-inline:0;display:flex;flex-direction:column;
  align-items:center;gap:.5rem;pointer-events:none;z-index:1000;
}
.t{
  padding:.75rem 1.25rem;border-radius:14px;color:#fff;font-weight:500;
  background:rgba(20,24,44,0.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 14px 34px -12px rgba(0,0,0,0.7);border:1px solid var(--bd);
  animation:drop .32s cubic-bezier(.2,.9,.3,1.35);
}
.t.success{background:linear-gradient(135deg,#1a9e5c,#0f7a45);border-color:transparent}
.t.error{background:linear-gradient(135deg,#d64545,#b83030);border-color:transparent}
@keyframes drop{from{transform:translateY(-22px);opacity:0}}

/* ---------- footer ---------- */
footer{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:1.4rem;
  padding:2rem 1.25rem 3rem;color:var(--mut);font-size:.9rem;
  position:relative;z-index:1;
}
footer a,footer button{
  color:inherit;background:none;border:0;font:inherit;cursor:pointer;
  text-decoration:none;transition:color .2s;padding:.2rem 0;
}
footer a:hover,footer button:hover{color:var(--pri2)}
footer span{opacity:.6}

/* ---------- dialog ---------- */
dialog{
  border:1px solid var(--bd);border-radius:24px;background:var(--surface2);color:var(--fg);
  padding:1.7rem;max-width:min(90vw,430px);box-shadow:0 40px 80px -20px rgba(0,0,0,0.75);
  animation:fadeUp .3s both;
}
dialog::backdrop{background:rgba(4,5,12,0.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
dialog p{margin:0 0 1.2rem;line-height:1.6}
dialog .row{justify-content:flex-end}

/* ---------- mobile: header becomes a floating bottom dock ---------- */
@media(max-width:760px){
  .hdr{
    top:auto;bottom:14px;left:12px;right:12px;transform:none;
    width:auto;max-width:none;justify-content:space-between;
    padding:8px 8px 8px 16px;border-radius:22px;gap:.5rem;
    animation:hdrInMobile .8s .2s both;
  }
  @keyframes hdrInMobile{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  html[dir=rtl] .hdr{padding:8px 16px 8px 8px}
